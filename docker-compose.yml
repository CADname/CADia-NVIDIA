services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cadia_hackathon}
      POSTGRES_USER: ${POSTGRES_USER:-cadia_hackathon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cadia_hackathon} -d ${POSTGRES_DB:-cadia_hackathon}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  app:
    build:
      context: .
      args:
        CODEX_CLI_VERSION: "${CODEX_CLI_VERSION:-0.154.0}"
        CADIA_UID: "${CADIA_UID:-10001}"
        CADIA_GID: "${CADIA_GID:-10001}"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NEXIS_ENV: production
      NEXIS_DATA_ROOT: /data
      NEXIS_SESSION_SECRET: ${NEXIS_SESSION_SECRET:?Set NEXIS_SESSION_SECRET in .env}
      NEXIS_COOKIE_SECURE: "${NEXIS_COOKIE_SECURE:-false}"
      NEXIS_CORS_ORIGINS: ${NEXIS_CORS_ORIGINS:-http://localhost:8000}
      NEXIS_ALLOWED_HOSTS: ${NEXIS_ALLOWED_HOSTS:-localhost,127.0.0.1}
      NEXIS_AI_PROVIDER: ${NEXIS_AI_PROVIDER:-app_server}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cadia_hackathon}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cadia_hackathon}
      CODEX_APP_SERVER_BIN: /usr/local/bin/codex
      CODEX_PROCESS_IDLE_SECONDS: ${CODEX_PROCESS_IDLE_SECONDS:-1800}
      NEXIS_MAX_CODEX_PROCESSES: ${NEXIS_MAX_CODEX_PROCESSES:-8}
      NEXIS_MAX_CONCURRENT_AI_TURNS: ${NEXIS_MAX_CONCURRENT_AI_TURNS:-2}
      CADIA_HEAVY_CAD_WORKERS: ${CADIA_HEAVY_CAD_WORKERS:-2}
      CADIA_HEAVY_QUEUE_TIMEOUT_SECONDS: ${CADIA_HEAVY_QUEUE_TIMEOUT_SECONDS:-7200}
      CADIA_HEAVY_CANCEL_GRACE_SECONDS: ${CADIA_HEAVY_CANCEL_GRACE_SECONDS:-8}
      CAD_ENGINE_IDLE_SECONDS: ${CAD_ENGINE_IDLE_SECONDS:-1800}
      NEXIS_MAX_UPLOAD_BYTES: ${NEXIS_MAX_UPLOAD_BYTES:-104857600}
      NEXIS_MESH_TOLERANCE: ${NEXIS_MESH_TOLERANCE:-0.08}
      NEXIS_EDGE_TOLERANCE: ${NEXIS_EDGE_TOLERANCE:-0.12}
      NEXIS_PREFERRED_MODELS: ${NEXIS_PREFERRED_MODELS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_MODEL: ${OPENAI_API_MODEL:-gpt-6.1-sol}
      CADIA_SHARED_OPENAI_ENABLED: "${CADIA_SHARED_OPENAI_ENABLED:-true}"
      CADIA_SHARED_OPENAI_MAX_CALLS_GLOBAL_DAY: "${CADIA_SHARED_OPENAI_MAX_CALLS_GLOBAL_DAY:-150}"
      CADIA_SHARED_OPENAI_MAX_OUTPUT_TOKENS: "${CADIA_SHARED_OPENAI_MAX_OUTPUT_TOKENS:-10000}"
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      # Nebius Token Factory + NVIDIA Nemotron engineering orchestration
      CADIA_NEMOTRON_ENABLED: "${CADIA_NEMOTRON_ENABLED:-true}"
      CADIA_NEMOTRON_TIMEOUT_SECONDS: ${CADIA_NEMOTRON_TIMEOUT_SECONDS:-90}
      CADIA_NEMOTRON_POST_VERIFY_ENABLED: "${CADIA_NEMOTRON_POST_VERIFY_ENABLED:-true}"
      CADIA_NEMOTRON_POST_VERIFY_AUTO_REPAIR: "${CADIA_NEMOTRON_POST_VERIFY_AUTO_REPAIR:-true}"
      CADIA_NEMOTRON_VERIFY_MIN_CONFIDENCE: ${CADIA_NEMOTRON_VERIFY_MIN_CONFIDENCE:-0.97}
      CADIA_NEMOTRON_HYBRID_MODE: "${CADIA_NEMOTRON_HYBRID_MODE:-balanced}"
      CADIA_HACKATHON_USERNAME: "${CADIA_HACKATHON_USERNAME:-judge}"
      CADIA_HACKATHON_PASSWORD: "${CADIA_HACKATHON_PASSWORD:-CHANGE_ME}"
      CADIA_HACKATHON_USER_EMAIL: "${CADIA_HACKATHON_USER_EMAIL:-judge@cadia.local}"
      CADIA_TOMTOM_API_KEY: "${CADIA_TOMTOM_API_KEY:-}"
      CADIA_GEOAPIFY_API_KEY: "${CADIA_GEOAPIFY_API_KEY:-}"
      CADIA_HACKATHON_LOCKDOWN: "${CADIA_HACKATHON_LOCKDOWN:-true}"
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-https://app.cadia.co.kr/api/auth/google/callback}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_REDIRECT_URI: ${GITHUB_OAUTH_REDIRECT_URI:-https://app.cadia.co.kr/api/ai/copilot/callback}
      CADIA_AI_AUTO_FALLBACK: "${CADIA_AI_AUTO_FALLBACK:-true}"
      BIMWRIGHT_INVENTOR_EXPORT_ROOT: ${BIMWRIGHT_INVENTOR_EXPORT_ROOT:-/data/projects}
      CADIA_SLICER_BACKEND: ${CADIA_SLICER_BACKEND:-prusa}
      CADIA_SLICER_BIN: ${CADIA_SLICER_BIN:-/usr/bin/prusa-slicer}
      CADIA_SLICER_PROFILE: ${CADIA_SLICER_PROFILE:-/app/web/backend/standalonecad_web/manufacturing/profiles/generic_pla_220.ini}
      CADIA_CURA_DEFINITION: ${CADIA_CURA_DEFINITION:-}
      CADIA_SLICER_TIMEOUT_SECONDS: ${CADIA_SLICER_TIMEOUT_SECONDS:-300}
      CADIA_OCTOPRINT_URL: ${CADIA_OCTOPRINT_URL:-}
      CADIA_OCTOPRINT_API_KEY: ${CADIA_OCTOPRINT_API_KEY:-}
      CADIA_MOONRAKER_URL: ${CADIA_MOONRAKER_URL:-}
      CADIA_MOONRAKER_API_KEY: ${CADIA_MOONRAKER_API_KEY:-}
      CADIA_ALLOW_MACHINE_EXECUTION: "${CADIA_ALLOW_MACHINE_EXECUTION:-false}"
      CADIA_STUDIO_ADMIN_EMAILS: ${CADIA_STUDIO_ADMIN_EMAILS:-}
      # NVIDIA Engineering Review: post-generation visual verification + bounded repair.
      CADIA_NVIDIA_REVIEW_ENABLED: "${CADIA_NVIDIA_REVIEW_ENABLED:-false}"
      CADIA_NVIDIA_AUTO_REPAIR: "${CADIA_NVIDIA_AUTO_REPAIR:-true}"
      CADIA_NVIDIA_COSMOS_BASE_URL: ${CADIA_NVIDIA_COSMOS_BASE_URL:-}
      CADIA_NVIDIA_COSMOS_API_KEY: ${CADIA_NVIDIA_COSMOS_API_KEY:-}
      CADIA_NVIDIA_COSMOS_MODEL: ${CADIA_NVIDIA_COSMOS_MODEL:-nvidia/cosmos3-nano-reasoner}
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      NEBIUS_TOKEN_FACTORY_BASE_URL: ${NEBIUS_TOKEN_FACTORY_BASE_URL:-https://api.tokenfactory.us-central1.nebius.com/v1}
      NEBIUS_NEMOTRON_MODEL: ${NEBIUS_NEMOTRON_MODEL:-nvidia/Nemotron-3-Ultra-550b-a55b}
      CADIA_NVIDIA_REVIEW_TIMEOUT_SECONDS: ${CADIA_NVIDIA_REVIEW_TIMEOUT_SECONDS:-180}
      CADIA_NVIDIA_RENDER_TIMEOUT_SECONDS: ${CADIA_NVIDIA_RENDER_TIMEOUT_SECONDS:-45}
      CADIA_NVIDIA_REVIEW_MIN_CONFIDENCE: ${CADIA_NVIDIA_REVIEW_MIN_CONFIDENCE:-0.62}
      CADIA_NVIDIA_VISUAL_REGRESSION_TOLERANCE: ${CADIA_NVIDIA_VISUAL_REGRESSION_TOLERANCE:-0.04}
      CADIA_NVIDIA_MAX_SOURCE_IMAGES: ${CADIA_NVIDIA_MAX_SOURCE_IMAGES:-4}
      CADIA_NVIDIA_MAX_MEDIA_BYTES: ${CADIA_NVIDIA_MAX_MEDIA_BYTES:-33554432}
      # OpenCV 5 Vision CAD: additive Drawing/Photo perception + deterministic closed-loop verification.
      CADIA_OPENCV_REQUIRE_MAJOR5: "${CADIA_OPENCV_REQUIRE_MAJOR5:-true}"
      CADIA_OPENCV_MAX_REPAIRS: ${CADIA_OPENCV_MAX_REPAIRS:-2}
      CADIA_OPENCV_DRAWING_THRESHOLD: ${CADIA_OPENCV_DRAWING_THRESHOLD:-0.78}
      CADIA_OPENCV_PHOTO_THRESHOLD: ${CADIA_OPENCV_PHOTO_THRESHOLD:-0.66}
      CADIA_OPENCV_MAX_EDGE: ${CADIA_OPENCV_MAX_EDGE:-2200}








    volumes:
      - cad_data:/data
    ports:
      - "127.0.0.1:8000:8000"
    stop_grace_period: 30s
    networks: [internal]

volumes:
  postgres_data:
  cad_data:

networks:
  internal:
    driver: bridge
